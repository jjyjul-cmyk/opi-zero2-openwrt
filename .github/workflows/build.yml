name: Build OpenWrt for Orange Pi Zero 2 (WiFi + BT + Docker)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      # 这两个目录只影响本地运维脚本/文档，改了不该白跑一次 40~90 分钟的编译
      - 'tools/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_BRANCH: openwrt-24.10
  TARGET: sunxi/cortexa53

jobs:
  build:
    name: Build sunxi/cortexa53 xunlong_orangepi-zero2
    # 24.04 上 OpenWrt 24.10 可以正常编；22.04 的 runner 正在陆续下线
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: 取出本仓库
        uses: actions/checkout@v4

      - name: 腾出磁盘（OpenWrt 全量编译需要 ~30GB）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get -y install \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libelf-dev libncurses5-dev libssl-dev \
            python3 python3-setuptools python3-venv \
            rsync swig unzip zip zlib1g-dev file wget ccache time
          df -h /

      - name: 克隆 OpenWrt 源码
        run: |
          git clone --depth 1 -b "$OPENWRT_BRANCH" "$OPENWRT_REPO" openwrt
          cd openwrt
          git rev-parse HEAD
          echo "OPENWRT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: 改造源码树（注入 AW859A 驱动 / DTS / 固件 / overlay）
        run: bash scripts/diy.sh

      - name: 更新并安装 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 套用配置并校验
        run: |
          cd openwrt
          cp ../configs/zero2.config .config
          make defconfig

          echo "===== 关键配置校验 ====="
          fail=0
          for s in \
            CONFIG_TARGET_sunxi_cortexa53_DEVICE_xunlong_orangepi-zero2 \
            CONFIG_PACKAGE_kmod-uwe5622 \
            CONFIG_PACKAGE_wpad-basic-mbedtls \
            CONFIG_PACKAGE_kmod-bluetooth \
            CONFIG_PACKAGE_bluez-daemon \
            CONFIG_PACKAGE_dockerd \
            CONFIG_PACKAGE_docker \
            CONFIG_PACKAGE_luci-app-dockerman \
            CONFIG_PACKAGE_luci \
            CONFIG_PACKAGE_kmod-veth \
            CONFIG_KERNEL_CGROUPS \
            CONFIG_KERNEL_CGROUP_DEVICE \
            CONFIG_KERNEL_MEMCG \
            CONFIG_KERNEL_NAMESPACES \
            CONFIG_KERNEL_POSIX_MQUEUE \
            CONFIG_KERNEL_SECCOMP \
            CONFIG_KERNEL_SECCOMP_FILTER ; do
            if grep -q "^$s=y" .config; then
              echo "  OK   $s"
            else
              echo "  MISS $s"
              fail=1
            fi
          done

          echo "===== 分区尺寸 ====="
          grep -E '^CONFIG_TARGET_ROOTFS_PARTSIZE=' .config || fail=1
          grep -q '^CONFIG_TARGET_ROOTFS_PARTSIZE=2048$' .config || { echo "  MISS 分区不是 2048"; fail=1; }

          echo "===== 驱动包是否真的进了配置 ====="
          grep -E '^CONFIG_PACKAGE_kmod-uwe5622=|^CONFIG_PACKAGE_kmod-bluetooth=' .config

          [ "$fail" = "0" ] || { echo; echo "配置校验失败：符号名可能变了，先别开编，检查上面的 MISS 项"; exit 1; }

      # ---------------------------------------------------------------
      # 这一步是这次改动的重点：只做"下载 + 打补丁"，几分钟就能跑完。
      # 因为 AW859A 的驱动是靠补丁注入 backports 的，backports 版本从
      # 6.12.6 漂到 6.12.96 就可能失配。与其等一小时后才炸，不如先在
      # 5~10 分钟内拿到确切的失败位置。
      # ---------------------------------------------------------------
      - name: 预检 · 只打补丁不编译（提前暴露失配）
        run: |
          set -o pipefail
          cd openwrt

          echo "=========== 1/2 mac80211(backports) 打 unisoc 补丁 ==========="
          make -j1 V=s package/kernel/mac80211/clean > /tmp/pf-mac80211.log 2>&1 || true
          if ! make -j1 V=s package/kernel/mac80211/prepare >> /tmp/pf-mac80211.log 2>&1; then
            echo "::error::mac80211 阶段失败（大概率是 unisoc 补丁与当前 backports 版本失配）"
            tail -150 /tmp/pf-mac80211.log
            exit 1
          fi

          # 断言驱动源码真的被打进了 backports 树，而不只是"补丁命令没报错"。
          #
          # 注意这里的路径深度：驱动最终落在
          #   build_dir/target-<arch>_musl/linux-sunxi_cortexa53/mac80211-regular/backports-<ver>/drivers/net/wireless/uwe5622
          # 从 build_dir 数起是 8 层。用 maxdepth 6 会**够不到**，于是把一次完全正常的
          # 编译误判成"补丁没生效"直接红掉（第一版就是栽在这里）。
          # 所以：一是 maxdepth 给足，二是同时用补丁日志做交叉验证，
          # 两条证据只要有一条成立就不算失败。
          echo "----- unisoc 补丁数 -----"
          ls package/kernel/mac80211/patches/unisoc | wc -l

          echo "----- 证据 A：补丁日志里写入的 uwe5622 源文件数 -----"
          n_patched="$(grep -c 'patching file drivers/net/wireless/uwe5622/' /tmp/pf-mac80211.log || true)"
          echo "$n_patched"

          echo "----- 证据 B：backports 树里的 uwe5622 驱动目录 -----"
          found="$(find build_dir -maxdepth 12 -type d -name 'uwe5622' 2>/dev/null | head -5)"
          [ -n "$found" ] && echo "$found" || echo "  (未找到)"

          echo "----- 关键源文件抽查 -----"
          for f in unisocwifi/main.c unisocwifi/sprdwl.h tty-sdio/tty.c; do
            p="$(find build_dir -maxdepth 13 -type f -path "*uwe5622/$f" 2>/dev/null | head -1)"
            [ -n "$p" ] && echo "  OK   $f" || echo "  MISS $f"
          done

          if [ "$n_patched" -gt 0 ] || [ -n "$found" ]; then
            echo "OK: unisoc 驱动已注入 backports（补丁写入 $n_patched 个文件）"
          else
            echo "::error::补丁跑完了，但补丁日志和 backports 树里都找不到 uwe5622 驱动 —— 补丁没真正生效"
            tail -80 /tmp/pf-mac80211.log
            exit 1
          fi

          echo "=========== 2/2 sunxi 内核 + DTS 打补丁 ==========="
          if ! make -j1 V=s target/linux/prepare > /tmp/pf-target.log 2>&1; then
            echo "::error::sunxi 内核/DTS 阶段失败"
            tail -150 /tmp/pf-target.log
            exit 1
          fi
          echo "OK: DTS 与内核补丁已应用"

      # rules.mk:346 定义了 CCACHE_DIR 默认为 $(TOPDIR)/.ccache，
      # 也就是 clone 出来的 openwrt/.ccache —— 不是 ~/.ccache。
      # 缓存错路径等于没有缓存，每次都要重编 60~90 分钟。
      - name: 恢复 ccache
        uses: actions/cache@v4
        with:
          path: openwrt/.ccache
          key: ccache-${{ env.OPENWRT_BRANCH }}-${{ hashFiles('configs/zero2.config', 'scripts/diy.sh') }}
          restore-keys: |
            ccache-${{ env.OPENWRT_BRANCH }}-

      - name: 下载源码包
        run: |
          set -o pipefail
          cd openwrt
          make -j"$(nproc)" download || make -j1 V=s download

      - name: 编译固件
        run: |
          set -o pipefail
          cd openwrt
          ( make -j"$(nproc)" V=s 2>&1 || make -j1 V=s 2>&1 ) | tee "$GITHUB_WORKSPACE/build.log"

      - name: 收集产物
        if: success()
        run: |
          mkdir -p out
          cp -v openwrt/bin/targets/sunxi/cortexa53/*orangepi-zero2* out/ 2>/dev/null || true
          cp -v openwrt/bin/targets/sunxi/cortexa53/sha256sums out/ 2>/dev/null || true
          cp -v openwrt/bin/targets/sunxi/cortexa53/profiles.json out/ 2>/dev/null || true
          cp -v openwrt/.config out/zero2.build.config 2>/dev/null || true
          echo "----- 产物清单 -----"
          ls -lh out/
          # sunxi 的 Device/Default 只声明了 IMAGES := sdcard.img.gz，
          # 所以每个设备只有一个镜像文件。这里做硬断言，避免"编译成功但没产物"
          # 时 upload-artifact 静默上传一个只有 config 的空包。
          ls out/*.img.gz >/dev/null 2>&1 || {
            echo "::error::out/ 里没有任何 *.img.gz —— 镜像命名可能变了，检查上面的产物清单"
            exit 1
          }
          echo "----- 校验 -----"
          ( cd out && sha256sum *.img.gz 2>/dev/null || true )

      - name: 上传固件
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-24.10-orangepi-zero2
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            /tmp/pf-mac80211.log
            /tmp/pf-target.log
          if-no-files-found: warn
          retention-days: 7
